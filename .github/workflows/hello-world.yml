name: Hello World Containers

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        instance: [1, 2, 3, 4]
    container:
      image: alpine:latest
    steps:
      - name: Print hello world
        run: echo "Hello world from container ${{ matrix.instance }}"
